<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | {{ office_name }}</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f6f7f8;
            color: #252a31;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .error-card {
            background: #fff;
            border-radius: 14px;
            padding: 48px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #9a7b42;
            margin-bottom: 14px;
        }

        .error-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fdeceb;
            color: #c0392b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        h1 {
            font-size: 22px;
            color: #17324d;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            background: #17324d;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 26px;
            border-radius: 8px;
        }

        .btn:hover {
            background: #0f2337;
        }

        .brand {
            margin-top: 32px;
            font-size: 13px;
            color: #9a9fa6;
        }

        .brand span {
            color: #9a7b42;
            font-weight: 700;
        }

    </style>

</head>

<body>

    <div class="error-card">

        <div class="error-code">
            ERROR 404
        </div>

        <div class="error-icon">
            !
        </div>

        <h1>
            Page Not Found
        </h1>

        <p>
            The page you are looking for does not exist or may
            have been moved.
        </p>

        <a href="/" class="btn">
            Back to Home
        </a>

        <div class="brand">
            Legal<span>Desk</span>
        </div>

    </div>

</body>

</html>
